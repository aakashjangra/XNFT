
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFT Preview Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --main-bg: #0d192b;
      --card-bg: #14253d;
      --white: #ffffff;
      --soft-blue: #8bacda;
      --cyan: #00fff7;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: var(--main-bg);
      color: var(--white);
      font-family: "Outfit", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 350px;
      padding: 24px;
      background-color: var(--card-bg);
      border-radius: 15px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
    }

    .card__images {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 8px;
      cursor: pointer;
    }

    .card__images img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card__images-layer {
      position: absolute;
      inset: 0;
      background-color: rgba(0, 255, 247, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.25s ease-in-out;
    }

    .card__images:hover .card__images-layer,
    .card__images:focus-within .card__images-layer {
      opacity: 1;
    }

    .card__images-layer img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .card__title {
      margin-top: 24px;
    }

    .card__title h1 {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.3;
      transition: color 0.2s ease;
    }

    .card__title h1:hover {
      color: var(--cyan);
      cursor: pointer;
    }

    .card__description {
      margin-top: 16px;
      color: var(--soft-blue);
      font-size: 18px;
      font-weight: 300;
      line-height: 1.5;
    }

    .card__time {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
      font-size: 15px;
    }

    .card__time-left,
    .card__time-right {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .card__time-left {
      color: var(--cyan);
      font-weight: 600;
    }

    .card__time-right {
      color: var(--soft-blue);
      font-weight: 400;
    }

    .card__time img {
      width: auto;
      height: 18px;
      object-fit: contain;
    }

    .card__divider {
      height: 1px;
      margin-top: 24px;
      background-color: #2f415b;
      border: 0;
    }

    .card__creator {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
      color: var(--soft-blue);
      font-size: 15px;
      font-weight: 300;
    }

    .card__creator img {
      width: 33px;
      height: 33px;
      border: 1px solid var(--white);
      border-radius: 50%;
      object-fit: cover;
    }

    .card__creator span {
      color: var(--white);
      transition: color 0.2s ease;
    }

    .card__creator span:hover {
      color: var(--cyan);
      cursor: pointer;
    }

    .attribution {
      margin-top: 24px;
      color: var(--soft-blue);
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
    }

    .attribution a {
      color: var(--cyan);
      text-decoration: none;
    }

    .attribution a:hover {
      text-decoration: underline;
    }

    @media (max-width: 375px) {
      body {
        padding: 20px;
      }

      .card {
        padding: 22px;
      }

      .card__title h1 {
        font-size: 20px;
      }

      .card__description {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="card__images" tabindex="0">
      <img
        src="images/image-equilibrium.jpg"
        alt="Equilibrium NFT artwork"
      />

      <div class="card__images-layer">
        <img
          src="images/icon-view.svg"
          alt="View NFT"
        />
      </div>
    </div>

    <div class="card__title">
      <h1>Equilibrium #3429</h1>
    </div>

    
<p id="info" class="card__description">Our Equilibrium collection promotes balance and calm.</p>


    <div class="card__time">
      <div class="card__time-left">
        <img
          src="images/icon-ethereum.svg"
          alt=""
        />
        <span>0.041 ETH</span>
      </div>

      <div class="card__time-right">
        <img
          src="images/icon-clock.svg"
          alt=""
        />
        <span>3 days left</span>
      </div>
    </div>

    <hr class="card__divider" />

    <div class="card__creator">
      <img
        src="images/image-avatar.png"
        alt="Creator avatar"
      />
      <p>Creation of <span>Jules Wyvern</span></p>
    </div>
  </main>

  <footer class="attribution">
    Challenge by
    <a
      href="https://www.crio.do"
      target="_blank"
      rel="noopener noreferrer"
    >Crio</a>.
    Coded by
    
<a
  href="https://www.github.com/aakashjangra"
  target="_blank"
  rel="noopener noreferrer"
>
  Aakash Jangra
</a>

  </footer>
</body>
</html>
